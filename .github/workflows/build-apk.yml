name: Build Android APK

# Manual trigger (Actions tab -> Build Android APK -> Run workflow) and on
# every push that touches the app or the android/ project, so the APK
# available for download always matches what's in the repo.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "templates/**"
      - "static/**"
      - "WorkingTemplate.docx"
      - "android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Point Gradle at the runner's preinstalled Android SDK
        # ubuntu-latest already ships a full SDK with licenses pre-accepted
        # (ANDROID_HOME) -- android-actions/setup-android tries to download
        # and re-accept a different cmdline-tools version on top of it and
        # hangs on an interactive license prompt. Just use what's there.
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Generate Gradle wrapper
        # The runner's system `gradle` (9.x) evaluates build.gradle before
        # running ANY task, including `wrapper` itself -- and AGP 8.5.2 isn't
        # compatible with Gradle 9. Generate the wrapper in an empty scratch
        # dir instead, so nothing of ours gets evaluated under the wrong
        # engine, then drop it into the real project.
        run: |
          mkdir -p /tmp/wrapper-scratch
          cd /tmp/wrapper-scratch
          touch settings.gradle
          gradle wrapper --gradle-version 8.7
          cp -r gradle gradlew gradlew.bat "$GITHUB_WORKSPACE/android/"

      - name: Verify wrapper
        working-directory: android
        run: ./gradlew --version

      - name: Build debug APK
        working-directory: android
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK with version
        id: version
        working-directory: android
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle | sed -E 's/.*versionName "([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          NAME="SiteReport-v${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/$NAME"
          echo "filename=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SiteReport-v${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/debug/${{ steps.version.outputs.filename }}
          if-no-files-found: error
