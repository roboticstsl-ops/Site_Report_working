name: Build Android APK

# Manual trigger (Actions tab -> Build Android APK -> Run workflow) and on
# every push that touches the app or the android/ project, so the APK
# available for download always matches what's in the repo.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "templates/**"
      - "static/**"
      - "WorkingTemplate.docx"
      - "android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Point Gradle at the runner's preinstalled Android SDK
        # ubuntu-latest already ships a full SDK with licenses pre-accepted
        # (ANDROID_HOME) -- android-actions/setup-android tries to download
        # and re-accept a different cmdline-tools version on top of it and
        # hangs on an interactive license prompt. Just use what's there.
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        working-directory: android
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: site-report-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
